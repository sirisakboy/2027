name: Build REMAP V.5 All Platforms
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            platform: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc
          - name: ubuntu-x86_64
            # ubuntu-22.04 (glibc 2.35) so the binary also runs on Debian 12 / antiX
            platform: ubuntu-22.04
            args: ""
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev libxdo-dev

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck (fail fast)
        run: npx tsc --noEmit

      - name: Build Tauri (.msi/.exe/.deb)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: remap-v5-${{ matrix.name }}
          path: src-tauri/target/**/bundle/**/*
